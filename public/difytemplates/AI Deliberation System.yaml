    - data:
        code: "import re\n\ndef main(raw_text: str, raw_feedback: str) -> dict:\n\
          \    \"\"\"\n    Combines the structured text into a single string (result)\
          \ and outputs it,\n    matching Dify's configuration where the output variable\
          \ is only 'result'.\n    \"\"\"\n    # 1. Structural processing of raw_text\
          \ (Main Log)\n    if not raw_text:\n        structured_log = \"\"\n    else:\n\
          \        structured_lines = []\n        lines = raw_text.split('\\n')\n\
          \        current_speaker = \"Unknown\"\n        \n        chat_pattern =\
          \ re.compile(r'^([^\\s—:]+)(?:\\s*—\\s*|\\s+)\\d{1,2}:\\d{2}(?::\\d{2})?(?:\\\
          s+\\d{4}/\\d{2}/\\d{2})?')\n        bbs_pattern = re.compile(r'^\\[ID:\\\
          s*([^\\]]+)\\]')\n        colon_pattern = re.compile(r'^([^\\s—:：]+)\\s*[:：]\\\
          s*(.*)$')\n\n        for line in lines:\n            line = line.strip()\n\
          \            if not line:\n                continue\n                \n\
          \            bbs_match = bbs_pattern.match(line)\n            if bbs_match:\n\
          \                current_speaker = bbs_match.group(1).strip()\n        \
          \        continue\n                \n            chat_match = chat_pattern.match(line)\n\
          \            if chat_match:\n                current_speaker = chat_match.group(1).strip()\n\
          \                continue\n                \n            colon_match = colon_pattern.match(line)\n\
          \            if colon_match:\n                speaker_candidate = colon_match.group(1).strip()\n\
          \                content_candidate = colon_match.group(2).strip()\n    \
          \            structured_text = f\"[Speaker]: {speaker_candidate} / [Content]:\
          \ \\\"{content_candidate}\\\"\"\n                structured_lines.append(structured_text)\n\
          \                current_speaker = speaker_candidate\n                continue\n\
          \n            if current_speaker != \"Unknown\":\n                reply_match\
          \ = re.search(r'(?:>>|@)([a-zA-Z0-9_\\-一-龠ぁ-んァ-ヶ]+)', line)\n          \
          \      if reply_match:\n                    reply_to = reply_match.group(1)\n\
          \                    clean_content = line.replace(f\">>{reply_to}\", \"\"\
          ).replace(f\"@{reply_to}\", \"\").strip()\n                    structured_text\
          \ = f\"[Speaker]: {current_speaker} / [Reply To]: {reply_to} / [Content]:\
          \ \\\"{clean_content}\\\"\"\n                else:\n                   \
          \ structured_text = f\"[Speaker]: {current_speaker} / [Content]: \\\"{line}\\\
          \"\"\n                structured_lines.append(structured_text)\n       \
          \         \n        structured_log = \"\\n\".join(structured_lines)\n  \
          \  \n    # 2. Return the structured log inside Dify's output variable \"\
          result\"\n    return {\n        \"result\": structured_log\n    }"
        code_language: python3
