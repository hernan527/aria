app:
  description: "Google Mapsから業種×地域で店舗を抽出し、自社サービスに応じた営業ターゲットレポートを生成。抽出件数（30〜100件）と抽出モード（全店舗 / デジタル弱い店のみ / 既存サイトあり店のみ）を入力で切り替え可能。チェーン店は自動除外。Web制作・SNS運用代行・DXコンサル・MEO・広告運用代行など、店舗営業全般に汎用利用できます。. Setup: get your Bright Data API token at https://get.brightdata.com/tp1oc (existing promo codes still apply)."
  icon: "\U0001F50D"
  icon_background: '#E8F4FD'
  mode: workflow
  name: "店舗営業リード発掘（Google Maps × Bright Data）"
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: "Bright Data API token"
    id: brd-api-token
    name: BRIGHTDATA_API_TOKEN
    selector:
    - env
    - BRIGHTDATA_API_TOKEN
    value: REPLACE_WITH_YOUR_BRIGHTDATA_TOKEN
    value_type: string
  - description: "Bright Data SERP zone name"
    id: brd-serp-zone
    name: BRIGHTDATA_SERP_ZONE
    selector:
    - env
    - BRIGHTDATA_SERP_ZONE
    value: serp_api1
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: code
      id: e1
      source: 'node_start'
      sourceHandle: source
      target: 'node_code_url'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: e2
      source: 'node_code_url'
      sourceHandle: source
      target: 'node_http_serp'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: e3
      source: 'node_http_serp'
      sourceHandle: source
      target: 'node_code_analyze'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: llm
      id: e4
      source: 'node_code_analyze'
      sourceHandle: source
      target: 'node_llm_report'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: e5
      source: 'node_llm_report'
      sourceHandle: source
      target: 'node_end'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: '業種・地域・自社サービス・抽出設定を入力'
        selected: false
        title: Start
        type: start
        variables:
        - label: "業種（例: 飲食店、美容院、整体院、エステ、整骨院、雑貨店）"
          max_length: 100
