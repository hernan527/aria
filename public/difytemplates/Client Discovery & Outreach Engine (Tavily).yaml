          text: 'Seller: {{#start_node.my_company#}}

            Offering: {{#start_node.what_we_offer#}}

            Target industry: {{#start_node.industry#}}

            Ideal customer: {{#start_node.ideal_customer#}}'
        retry_config:
          enabled: false
          exponential_backoff:
            enabled: false
