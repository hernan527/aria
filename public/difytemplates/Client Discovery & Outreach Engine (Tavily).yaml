app:
  description: Client Discovery & Outreach Engine. You describe your company, offering,
    and target industry; it generates discovery searches to find candidate client
    companies via Tavily, deduplicates them, qualifies and scores each on fit and
    buying signals, routes them into tiers A/B/C, and drafts a tier-tailored outreach
    message for each. Outputs a ranked tiered lead list plus ready-to-send draft messages.
  icon: 🧲
  icon_background: '#EFF6FF'
  icon_type: emoji
  mode: workflow
  name: Client Discovery & Outreach Engine (Tavily)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.4.3@84d4aae2c55724f6cdaecfadceed061d7e6b6693ae8945ea2dcd155f280743ef
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tavily:0.1.10@b43f5dc49fbafc69949ee8231d600b23fb7586d514f4c72e470a86af03d2173d
    version: null
kind: app
version: 0.6.0
