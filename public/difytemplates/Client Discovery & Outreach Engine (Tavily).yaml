    - data:
        code: "import json\n\ndef main(items: list) -> dict:\n    seen = {}\n    for\
          \ it in (items or []):\n        t = (it or '').strip()\n        if t.startswith('```'):\n\
          \            t = t.strip('`')\n            if t.startswith('json'):\n  \
          \              t = t[4:]\n        try:\n            arr = json.loads(t)\n\
          \        except Exception:\n            arr = []\n        if not isinstance(arr,\
          \ list):\n            continue\n        for o in arr:\n            if isinstance(o,\
          \ dict) and o.get('company'):\n                name = str(o['company']).strip()\n\
          \                key = name.lower()\n                if key and key not\
          \ in seen:\n                    seen[key] = name\n    companies = list(seen.values())[:10]\n\
          \    return {\"companies\": companies, \"found\": len(companies)}\n"
