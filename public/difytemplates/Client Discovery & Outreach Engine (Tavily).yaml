    - data:
        code: "import json\n\ndef main(items: list) -> dict:\n    rows = []\n    for\
          \ it in (items or []):\n        t = (it or '').strip()\n        if t.startswith('```'):\n\
          \            t = t.strip('`')\n            if t.startswith('json'):\n  \
          \              t = t[4:]\n        try:\n            o = json.loads(t)\n\
          \        except Exception:\n            continue\n        if not isinstance(o,\
          \ dict):\n            continue\n        for k in ('fit', 'intent'):\n  \
          \          try: o[k] = int(o.get(k, 0))\n            except Exception: o[k]\
          \ = 0\n        o['lead_score'] = o['fit'] * 2 + o['intent']\n        if\
          \ o['lead_score'] >= 12:\n            o['tier'] = 'A'\n        elif o['lead_score']\
          \ >= 8:\n            o['tier'] = 'B'\n        else:\n            o['tier']\
          \ = 'C'\n        rows.append(o)\n    rows.sort(key=lambda r: r.get('lead_score',\
          \ 0), reverse=True)\n    counts = {'A': 0, 'B': 0, 'C': 0}\n    for r in\
          \ rows:\n        counts[r['tier']] = counts.get(r['tier'], 0) + 1\n    return\
          \ {\"leads\": json.dumps(rows, ensure_ascii=False, indent=2), \"summary\"\
          : json.dumps(counts), \"total\": len(rows)}\n"
        code_language: python3
        desc: Score each lead, assign tier A/B/C, rank.
