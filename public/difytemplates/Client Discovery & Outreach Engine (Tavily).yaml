          \            t = t[4:]\n    try:\n        arr = json.loads(t)\n        if\
          \ not isinstance(arr, list):\n            arr = [str(arr)]\n    except Exception:\n\
          \        arr = [l.strip('-* ') for l in t.splitlines() if l.strip()]\n \
